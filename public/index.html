<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>COPDai Assistant</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
padding:30px;
}


#chat{
height:400px;
overflow:auto;
border:1px solid #444;
padding:20px;
margin-bottom:20px;
}


input{
width:80%;
padding:12px;
font-size:16px;
}


button{
padding:12px 20px;
font-size:16px;
}

.user{
color:#4caf50;
margin:10px;
}


.ai{
color:#00bcd4;
margin:10px;
}


</style>

</head>


<body>


<h1>COPDai Assistant</h1>


<div id="chat"></div>


<input id="msg" placeholder="请输入问题">


<button onclick="send()">
发送
</button>



<script>


async function send(){


let input=document.getElementById("msg");

let text=input.value;


if(!text)return;


let box=document.getElementById("chat");


box.innerHTML +=
`
<div class="user">
你：${text}
</div>
`;


input.value="";



let res=await fetch("/api/chat",{


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


message:text


})


});



let data=await res.json();



console.log(data);



let answer=
data.data
?.data
?.message
||
JSON.stringify(data);



box.innerHTML +=
`
<div class="ai">
AI：${answer}
</div>
`;



box.scrollTop=box.scrollHeight;


}


</script>



</body>

</html>
